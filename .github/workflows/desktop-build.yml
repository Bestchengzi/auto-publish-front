name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "apps/desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            cmd: cd apps/desktop && npm run build && npx electron-builder --win nsis --publish never
          - name: macos-intel-x64
            os: macos-13
            cmd: cd apps/desktop && npm run build && npx electron-builder --mac dmg zip --x64 --publish never
          - name: macos-apple-silicon-arm64
            os: macos-14
            cmd: cd apps/desktop && npm run build && npx electron-builder --mac dmg zip --arm64 --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          npm ci
          npm --prefix apps/desktop ci

      - name: Build installers
        env:
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: ${{ matrix.cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            !apps/desktop/release/*.blockmap
