name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "apps/desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: cd apps/desktop && npm run build && npx electron-builder --win nsis --publish never
            artifact_path: apps/desktop/release/*
          - os: macos-latest
            cmd: cd apps/desktop && npm run build && npx electron-builder --mac dmg zip --publish never
            artifact_path: apps/desktop/release/*

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          npm ci
          npm --prefix apps/desktop ci

      - name: Build installers
        env:
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
        run: ${{ matrix.cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
