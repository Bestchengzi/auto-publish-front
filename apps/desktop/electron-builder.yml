appId: com.mediaautopublish.KeduckAI
productName: KeduckAI

directories:
  output: release

files:
  - "dist/**"
  - "package.json"

asar: true

win:
  signAndEditExecutable: true
  icon: assets/icons/icon.ico
  target:
    - target: nsis
  # 不含 version：固定 OSS 对象名，发版覆盖上传即可，官网直链无需随版本改
  artifactName: "KeduckAI-${os}-${arch}.${ext}"

mac:
  icon: assets/icons/icon.icns
  target:
    - target: dmg
    - target: zip
  artifactName: "KeduckAI-${os}-${arch}.${ext}"
  category: public.app-category.productivity

linux:
  icon: assets/icons/icon.png
  target:
    - target: AppImage
  category: Utility
  artifactName: "KeduckAI-${os}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  # Windows：`latest.yml` + 安装包放在桶根。Mac：运行时改为 `mac/x64/`、`mac/arm64/`（见 main.ts），上传 OSS 时按架构分目录。
  url: "https://open-stack.oss-cn-shanghai.aliyuncs.com/"
