appId: com.mediaautopublish.KeduckAI
productName: KeduckAI

directories:
  output: release

files:
  - "dist/**"
  - "package.json"

asar: true

win:
  signAndEditExecutable: true
  icon: assets/icons/icon.ico
  target:
    - target: nsis
  artifactName: "KeduckAI-${os}-${arch}.${ext}"

mac:
  icon: assets/icons/icon.icns
  target:
    - target: dmg
    - target: zip
  artifactName: "KeduckAI-${os}-${arch}.${ext}"
  category: public.app-category.productivity

linux:
  icon: assets/icons/icon.png
  target:
    - target: AppImage
  category: Utility
  artifactName: "KeduckAI-${os}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  # Build-time only: GitHub Actions uses this to generate latest.yml/latest-mac.yml.
  # Runtime update checks call /api/versions first and override the feed with ymlUrl.
  url: "https://keduck.cn/"
