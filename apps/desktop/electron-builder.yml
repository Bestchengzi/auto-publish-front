appId: com.mediaautopublish.keduckAI
productName: KeduckAI

directories:
  output: release

files:
  - "dist/**"
  - "package.json"

asar: true

win:
  signAndEditExecutable: true
  icon: assets/icons/icon.ico
  target:
    - target: nsis
  # 不含 version：固定 OSS 对象名，发版覆盖上传即可，官网直链无需随版本改
  artifactName: "keduckAI-${os}-${arch}.${ext}"

mac:
  icon: assets/icons/icon.icns
  target:
    - target: dmg
    - target: zip
  artifactName: "keduckAI-${os}-${arch}.${ext}"
  category: public.app-category.productivity

linux:
  icon: assets/icons/icon.png
  target:
    - target: AppImage
  category: Utility
  artifactName: "keduckAI-${os}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  # 与手动上传到 OSS 的根路径一致（末尾 / 便于拼接 latest*.yml 与安装包）
  url: "https://open-stack.oss-cn-shanghai.aliyuncs.com/"
