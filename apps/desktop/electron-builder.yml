appId: com.mediaautopublish.desktop
productName: 可达AI

directories:
  output: release

files:
  - "dist/**"
  - "package.json"

asar: true

win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

mac:
  icon: build/icon.icns
  target:
    - target: dmg
    - target: zip
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  category: public.app-category.productivity

linux:
  icon: build/icon.png
  target:
    - target: AppImage
  category: Utility
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: "${env.GH_OWNER}"
  repo: "${env.GH_REPO}"
