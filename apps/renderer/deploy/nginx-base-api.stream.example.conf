# 示例：生产环境 Nginx 反代「/baseApi」到后端，并保留流式（LangGraph runs/stream、SSE 等）
# 按需合并进现有 server { }，并修改 upstream 地址与路径前缀。
#
# 要点：
# - proxy_buffering off：禁止 Nginx 攒满响应再下发，流式必备
# - 拉长超时：长对话流可能持续很久
# - 对该路径关闭 gzip：避免压缩层为效率而缓冲整块再输出
# - 上游若为 Nginx 子请求，可在 LangGraph/后端对流式响应加：X-Accel-Buffering: no

upstream backend_api {
    server 192.168.88.30:22026;  # 与 next.config rewrites 目标一致，按生产修改
    keepalive 32;
}

location /baseApi/ {
    proxy_pass http://backend_api/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;
    gzip off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
